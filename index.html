<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>無限非常ボタン Web版</title>

    <style>
        body {
            background-color: white;
            color: black;
            text-align: center;
            font-family: 'MS UI Gothic', sans-serif;
        }

        #pictureBox1 {
            width: 220px;
            margin-top: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #labelCount {
            font-size: 24px;
            margin-top: 20px;
        }

        #infoText {
            font-size: 18px;
            margin-top: 30px;
            color: #444;
        }
    </style>
</head>

<body>

    <h1>無限非常ボタン</h1>

    <img id="pictureBox1" src="button.jpg">

    <p id="labelCount">押した回数：0</p>

    <p id="infoText">長押しは最大7秒まで使えます</p>

    <audio id="sound" src="非常ベル-効果音.wav"></audio>

    <script src="script.js"></script>

</body>
</html>
